[build]
  publish = "dist"
  command = "npm run build"

# Allow any website to embed the script and assets (CORS)
[[headers]]
  for = "/*.js"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cookie-access.bundle.js"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Fallback for SPA routing if needed
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
